<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="oklch(12.63% 0.0069 258.37)" />
    <title>Worldview Editor</title>
    <script>
      try {
        const preference = localStorage.getItem('worldview.editor.theme') || 'system';
        document.documentElement.dataset.theme =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : preference;
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        background: oklch(12.63% 0.0069 258.37);
      }

      html[data-theme='light'],
      html[data-theme='light'] body,
      html[data-theme='light'] #app {
        background: oklch(96.5% 0.004 255);
      }

      html {
        color-scheme: dark;
      }

      html[data-theme='light'] {
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
